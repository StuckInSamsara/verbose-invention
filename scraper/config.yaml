# Configuration for Mistral AI documentation scraper

# Domains to scrape
domains:
  - name: "Mistral Docs (EN)"
    base_url: "https://docs.mistral.ai"
    language: "en"
    allowed_paths:
      - "/models"
      - "/api"
      - "/getting-started"
      - "/resources"
      - "/developers"
      - "/admin"
      - "/products"
    disallowed_paths:
      - "/private"
      - "/internal"
      - "/_next"  # Next.js static files
      - "/assets" # Static assets
    selectors:
      title: "h1"
      content: "article.prose"
      links: "article.prose a[href^='/'], main a[href^='/']"
      last_updated: "time, .last-updated"

  - name: "Mistral Site (FR)"
    base_url: "https://mistral.ai/fr"
    language: "fr"
    allowed_paths:
      - "/products"
      - "/solutions"
      - "/models"
      - "/news"
      - "/customers"
      - "/industry"
      - "/about"
      - "/careers"
      - "/contact"
      - "/partners"
    disallowed_paths:
      - "/console"
      - "/legal"
      - "/terms"
      - "/_next"
      - "/assets"
      - "/cms-media"
    selectors:
      title: "h1"
      content: "main, article, .content"
      links: "a[href^='/fr/']"
      last_updated: "time, .last-updated"

# Scraping settings
scraping:
  delay: 1.0  # Seconds between requests (respectful crawling)
  max_depth: 3 # Max depth for recursive scraping
  user_agent: "MistralDocsScraper/1.0 (+https://github.com/StuckInSamsara/verbose-invention)"
  timeout: 15  # Request timeout in seconds
  retries: 3   # Number of retries for failed requests
  max_pages: 500 # Maximum pages to scrape per run

# Output settings
output:
  format: "jsonl"  # or "markdown"
  raw_dir: "data/raw/docs_mistral_ai"
  processed_dir: "data/processed/en"
  final_dir: "data/output"
  indent: 2  # JSON indentation

# Logging
logging:
  level: "INFO"
  file: "scraper.log"
